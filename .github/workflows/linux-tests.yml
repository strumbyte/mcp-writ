# On-demand Linux verification, complementing ci.yml / platform-tests.yml:
#   - real aarch64 Linux (ubuntu-24.04-arm, free for public repos)
#   - Linux-only Warden enforcement paths (seccomp + Landlock) on x86_64
#   - aarch64-gated unit tests (e.g. the aarch64 seccomp name resolution)
#     running on real ARM hardware
#
# Manual dispatch only — no automatic triggers, matching the repo policy
# of limiting GitHub Actions usage.

name: Linux tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail (not skip) when an e2e prerequisite is missing: a skipped test
  # must not count as verification evidence on this workflow.
  MCP_WRIT_REQUIRE_E2E_TESTS: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Documentation links and encoding
        run: python3 scripts/check_docs.py

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: Documentation tests
        run: cargo test --locked --doc

      - name: Integration tests
        run: >-
          cargo test --locked
          --test integration --test kdl_policy_e2e
          --test legislator_protocol_versions --test tool_enforcement_e2e
          --test self_test --test go_runtime_policy
          --test path_resolution_e2e --test diagnostics_e2e
