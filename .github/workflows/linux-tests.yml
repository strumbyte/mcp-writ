# On-demand Linux verification, complementing ci.yml / platform-tests.yml:
#   - real aarch64 Linux (ubuntu-24.04-arm, free for public repos)
#   - Linux-only Warden enforcement paths (seccomp + Landlock) on x86_64
#   - aarch64-gated unit tests (e.g. the aarch64 seccomp name resolution)
#     running on real ARM hardware
#
# Manual dispatch only — no automatic triggers, matching the repo policy
# of limiting GitHub Actions usage.

name: Linux tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail (not skip) when an e2e prerequisite is missing: a skipped test
  # must not count as verification evidence on this workflow.
  MCP_WRIT_REQUIRE_E2E_TESTS: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Unit tests
        run: cargo test --locked --lib --bins --no-fail-fast

      - name: Documentation tests
        run: cargo test --locked --doc

      - name: Integration tests
        # The inspector_*, docs_check, module_layering, manifest_fixtures,
        # and capability_matrix targets are host-independent guard-rails;
        # PR-17 registered them here so a dispatched Linux run carries the
        # same evidence as CI rather than leaving the checks to another
        # workflow (capability_matrix also asserts the plan's egress
        # layers against the catalog row for each native matrix host).
        run: >-
          cargo test --locked --no-fail-fast
          --test integration --test kdl_policy_e2e
          --test protocol_versions --test mcp_wire_e2e --test tool_enforcement_e2e
          --test self_test --test go_runtime_policy
          --test path_resolution_e2e --test diagnostics_e2e
          --test environment_e2e --test workload_hash_e2e
          --test inspector_arm64_p4 --test inspector_arm64_p5
          --test inspector_macho_p6 --test docs_check
          --test module_layering --test manifest_fixtures
          --test capability_matrix
          --test plan_report_e2e --test windows_probe_e2e
          --test audit_durability_e2e --test dns_gate_e2e --test unotify_e2e
          --test denial_audit_e2e --test policy_check_e2e

      - name: Namespaced e2e prerequisites (x86_64)
        # linux_mechanism_e2e drives the real userns+netns+TUN path and
        # runs under MCP_WRIT_REQUIRE_E2E_TESTS=1, so a capability skip
        # fails the job. Unprivileged GA runners deny user namespaces
        # through Ubuntu's AppArmor restriction and may lack /dev/net/tun
        # until the module is loaded — configure both here. The
        # namespaced route is adopted on Linux x86-64 only (capability
        # matrix), so the ARM leg does not carry this target — the
        # runner.arch pin keeps that true even if the 'ubuntu-latest'
        # label is ever re-pointed at ARM hardware.
        if: matrix.os == 'ubuntu-latest' && runner.arch == 'X64'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe tun
          test -c /dev/net/tun

      - name: Namespaced mechanism e2e (x86_64)
        if: matrix.os == 'ubuntu-latest' && runner.arch == 'X64'
        run: cargo test --locked --test linux_mechanism_e2e
