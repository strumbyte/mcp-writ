name: Container tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: container-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Docker integration tests
    # The fixture uses Debian bookworm; build the GNU runner against an
    # older host glibc so it also runs inside that image.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      MCP_WRIT_REQUIRE_CONTAINER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Require a running Docker daemon
        run: docker info
      - name: Build binaries
        run: cargo build --locked --bins
      - name: Test container workflows without skipping prerequisites
        run: >-
          cargo test --locked
          --test container_e2e --test containerize_e2e --test wrap_image_e2e
          -- --nocapture
