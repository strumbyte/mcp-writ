# Automatic push/PR triggers stay off to limit GitHub Actions usage.
# Run manually, let Release call this verification workflow, or let the
# weekly schedule (PR-07) leave execution evidence for the unreleased
# main tip — `schedule` always targets the default branch.
name: CI

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly, Monday 03:17 UTC — default branch (main).
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail (not skip) when an e2e prerequisite is missing: a skipped test
  # must not count as verification evidence on this workflow.
  MCP_WRIT_REQUIRE_E2E_TESTS: "1"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `sandbox require_lifetime_boundary` (default on) arms a
      # kernel-enforced descendant boundary: the launcher creates a
      # private cgroup under the v2 root and migrates the child into it
      # — both need write access on the shared hierarchy, which hosted
      # runners withhold. Delegating the root here arms the real
      # mechanism; on hosts where it fails the fixtures declare the
      # documented waiver instead of passing unexecuted.
      - name: Delegate cgroup v2 root for supervised-launch tests
        run: |
          sudo chmod o+w /sys/fs/cgroup /sys/fs/cgroup/cgroup.procs || true
          if test -w /sys/fs/cgroup; then
            echo "cgroup v2 root delegated — lifetime-boundary tests run enforced"
          else
            echo "cgroup v2 root unwritable — fixtures will declare the waiver"
          fi

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The fuzz package is outside `default-members`, so the clippy
      # run above never builds it — lint it explicitly or a façade-API
      # drift would only surface at the next manual fuzz.yml dispatch.
      - name: Fuzz targets
        run: cargo clippy --locked --all-targets --manifest-path fuzz/Cargo.toml -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Unit tests
        run: cargo test --locked --lib --bins --no-fail-fast

      - name: Documentation tests
        run: cargo test --locked --doc

      - name: Integration tests
        run: >-
          cargo test --locked --no-fail-fast
          --test integration --test kdl_policy_e2e
          --test protocol_versions --test mcp_wire_e2e --test tool_enforcement_e2e
          --test self_test --test go_runtime_policy
          --test path_resolution_e2e --test diagnostics_e2e
          --test environment_e2e --test workload_hash_e2e
          --test inspector_arm64_p4 --test inspector_arm64_p5
          --test inspector_macho_p6 --test docs_check
          --test module_layering --test manifest_fixtures
          --test capability_matrix
          --test plan_report_e2e --test windows_probe_e2e
          --test audit_durability_e2e --test audit_reopen_e2e
          --test dns_gate_e2e --test unotify_e2e
          --test denial_audit_e2e --test policy_check_e2e
