# Manual or called by Release; does not run on every pull request.
name: Go MCP runtime compatibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-runtime:
    name: Go 1.25.4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.4"
          cache-dependency-path: tests/fixtures/go_mcp/go.sum
      - name: Test policy and syscall contracts
        run: |
          cargo test --locked --test go_runtime_policy
          cargo test --locked --lib go_runtime_syscalls_are_mapped_but_not_implicitly_allowed
      - name: Test Go fixture and build executables
        run: |
          go -C tests/fixtures/go_mcp test ./...
          go -C tests/fixtures/go_mcp vet ./...
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          mkdir -p target/go-runtime
          go -C tests/fixtures/go_mcp build -trimpath -o "../../../target/go-runtime/go-runtime-mcp$suffix" .
          cargo build --locked --bin mcp-writ
      - name: Compare direct and sandboxed execution
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          fixture="./target/go-runtime/go-runtime-mcp$suffix"
          guard="./target/debug/mcp-writ$suffix"
          result=0
          for protocol in 2025-11-25 2026-07-28; do
            "$fixture" probe -protocol "$protocol" || result=1
            "$fixture" probe -protocol "$protocol" -guard "$guard" || result=1
          done
          exit "$result"
      - name: Save probe results even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-runtime-${{ matrix.os }}
          path: target/go-runtime-results/
          if-no-files-found: warn
          retention-days: 7
