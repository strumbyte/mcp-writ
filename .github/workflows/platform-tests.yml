name: Platform tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Fail (not skip) when an e2e prerequisite is missing: a skipped
      # test must not count as verification evidence on this workflow.
      MCP_WRIT_REQUIRE_E2E_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Integration tests
        run: >-
          cargo test --locked
          --test integration --test kdl_policy_e2e
          --test protocol_versions --test tool_enforcement_e2e
          --test self_test --test go_runtime_policy
          --test path_resolution_e2e --test diagnostics_e2e
          --test environment_e2e --test workload_hash_e2e
          --test inspector_arm64_p4 --test inspector_arm64_p5
          --test inspector_macho_p6 --test docs_check
          --test module_layering --test manifest_fixtures
