name: Platform tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # Fail (not skip) when an e2e prerequisite is missing: a skipped
      # test must not count as verification evidence on this workflow.
      MCP_WRIT_REQUIRE_E2E_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --lib --bins
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Protocol and policy integration tests
        run: >-
          cargo test --locked
          --test integration --test kdl_policy_e2e
          --test legislator_protocol_versions --test tool_enforcement_e2e
          --test self_test --test go_runtime_policy
          --test path_resolution_e2e --test diagnostics_e2e
