# Minimal pull-request gate (D-1, PR-17): one Linux job that runs on
# every PR touching code, tests, or docs. The full suites stay manual
# (ci.yml / platform-tests.yml / linux-tests.yml); this job exists so a
# fmt/clippy/unit-test or guard-rail regression cannot merge without
# evidence. Path-filtered: PRs touching only paths outside the list —
# scripts/**, other workflow files, repo-root tooling config — skip the
# gate entirely. That is deliberate (none of the checks below would
# exercise them), at the recorded cost that a broken helper script can
# merge without CI signal.
#
# Coverage: fmt, clippy, lib/bins (includes cli::tests_parse),
# capability_matrix, docs_check, module_layering, manifest_fixtures.

name: PR checks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "fuzz/**"
      - ".github/workflows/pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail (not skip) when an e2e prerequisite is missing: a skipped test
  # must not count as verification evidence on this workflow.
  MCP_WRIT_REQUIRE_E2E_TESTS: "1"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `sandbox require_lifetime_boundary` (default on) needs a writable
      # cgroup v2 root to arm the kernel descendant boundary — delegate
      # it so lib/bins tests that launch supervised children run
      # enforced rather than refused.
      - name: Delegate cgroup v2 root for supervised-launch tests
        run: |
          sudo chmod o+w /sys/fs/cgroup /sys/fs/cgroup/cgroup.procs || true
          if test -w /sys/fs/cgroup; then
            echo "cgroup v2 root delegated — lifetime-boundary tests run enforced"
          else
            echo "cgroup v2 root unwritable — fixtures will declare the waiver"
          fi

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The fuzz package is outside `default-members`, so the clippy
      # run above never builds it — lint it explicitly or a façade-API
      # drift would only surface at the next manual fuzz.yml dispatch.
      - name: Fuzz targets
        run: cargo clippy --locked --all-targets --manifest-path fuzz/Cargo.toml -- -D warnings

      - name: Unit tests (incl. CLI parse)
        run: cargo test --locked --lib --bins --no-fail-fast

      - name: Guard-rail tests
        run: >-
          cargo test --locked --no-fail-fast
          --test capability_matrix --test docs_check
          --test module_layering --test manifest_fixtures
