# Manual VM-isolation verification (PR-25) — the adopted VM methods'
# owned validation jobs. Hosted runners cannot provide the virtualization
# environments these methods need, so every job targets a self-hosted
# runner that meets the method's environment contract
# (docs/validation/*.md):
#
#   job                 runs-on labels                        host needs
#   ------------------  ------------------------------------  --------------------------------------
#   kata                [self-hosted, linux, kata]            docker + registered `kata` runtime,
#                                                             /dev/kvm + /dev/vhost-vsock
#   apple-container     [self-hosted, macos, apple-container] macOS arm64 + running `container` system
#   hyperv              [self-hosted, windows, hyperv]        Windows-mode dockerd (OSType=windows)
#   windows-sandbox     [self-hosted, windows, windows-sandbox] Windows 11 + wsb CLI + Sandbox feature
#   wslc                [self-hosted, windows, wslc]          Windows x86-64, interactive logon,
#                                                             WSL >= 2.9.3 with `wslc` resolvable
#   windows-isolation   [self-hosted, windows, winiso]        Windows x86-64 retail, interactive
#                                                             logon, rustc — native mechanism
#                                                             evaluation (not a VM method)
#
# Each job runs scripts/validate-<method>.*, which gates on the method's
# MCP_WRIT_REQUIRE_*_TESTS=1 (an unexecuted or unevidenced run fails, a
# missing capability is never a pass) and leaves an evidence bundle
# under .local/<method>-validation/<utc>-<uuid>/ — uploaded here as a
# workflow artifact even on failure. Record the outcome in
# docs/test-matrix.md.
#
# Manual dispatch only: no push/PR triggers, and intentionally no
# workflow_call — release/publication workflows must not imply VM
# acceptance from runners that cannot execute it.
#
# Privileged-dispatch trust boundary: workflow_dispatch lets the
# dispatcher pick any branch or tag name, and these jobs execute that
# ref's workflow AND scripts on persistent self-hosted runners with
# virtualization privileges — an arbitrary ref would hand untrusted
# code root-adjacent, persistent host access.
#
# Gates are layered, in strict order of authority:
#
#   1. AUTHORITATIVE (outside this file — a dispatched ref controls its
#      own copy of this YAML, so nothing in it can gate the ref itself):
#      register every privileged runner in a runner group whose
#      workflow restriction is pinned to the default branch —
#      `OWNER/mcp-writ/.github/workflows/vm-tests.yml@refs/heads/main`
#      (org → Settings → Actions → Runner groups). Jobs in this
#      workflow at any other ref then find no eligible runner and fail
#      closed, no matter how the ref edits this file. See
#      docs/validation/manual-ci.md → "Runner setup".
#   2. Defense-in-depth (this file — still worth keeping, but a
#      hostile ref can delete or rewrite them):
#      - `authorize` fails the run unless the dispatched ref is exactly
#        the repository default branch — a fast-path rejection for
#        accidental off-branch dispatches, not a security boundary.
#      - `environment: vm-validation` routes every privileged job
#        through a named deployment environment, so repo admins can
#        require reviewer approval and restrict deployable branches
#        (Settings → Environments) before runner pickup — effective
#        only while the ref keeps the `environment:` key.
#
# Personal accounts cannot create runner groups (org/enterprise
# feature), so a repo-level runner on a personal account has NO
# ref-independent gate — there the environment reviewers plus operator
# discipline are the whole mitigation.

name: VM tests

on:
  workflow_dispatch:
    inputs:
      method:
        description: Which method to validate (windows-isolation is the native Windows mechanism suite)
        required: true
        default: all
        type: choice
        options: [all, kata, apple-container, hyperv, windows-sandbox, wslc, windows-isolation]

permissions:
  contents: read

concurrency:
  # Serialize per ref, but never cancel: a killed VM job leaves its
  # teardown (QEMU / container unit deletion) half-done on a runner
  # that keeps its state between runs.
  group: vm-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast-path rejection for off-default-branch dispatches — a dispatched
  # ref controls its own copy of this file and can delete this job, so
  # this is defense-in-depth, NOT the trust boundary (see the header).
  # Runs on a hosted runner so the check itself never occupies a
  # self-hosted slot.
  authorize:
    name: Authorize privileged dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatched ref must be the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "dispatched ref: $REF"
          echo "allowed ref:    refs/heads/$DEFAULT_BRANCH"
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::vm-tests jobs run privileged on persistent self-hosted runners; only the default branch may dispatch them"
            exit 1
          fi

  kata:
    name: Kata VM validation
    needs: authorize
    if: ${{ inputs.method == 'all' || inputs.method == 'kata' }}
    runs-on: [self-hosted, linux, kata]
    environment: vm-validation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"

      - name: Kata validation job
        run: scripts/validate-kata.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kata-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: .local/kata-validation/
          include-hidden-files: true
          if-no-files-found: warn

  apple-container:
    name: Apple container VM validation
    needs: authorize
    if: ${{ inputs.method == 'all' || inputs.method == 'apple-container' }}
    runs-on: [self-hosted, macos, apple-container]
    environment: vm-validation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin, aarch64-unknown-linux-musl, x86_64-unknown-linux-musl

      - name: Apple container validation job
        run: scripts/validate-apple-container.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: .local/apple-validation/
          include-hidden-files: true
          if-no-files-found: warn

  hyperv:
    name: Hyper-V container VM validation
    needs: authorize
    if: ${{ inputs.method == 'all' || inputs.method == 'hyperv' }}
    runs-on: [self-hosted, windows, hyperv]
    environment: vm-validation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"

      - name: Hyper-V validation job
        shell: pwsh
        run: scripts/validate-hyperv.ps1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperv-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: .local/hyperv-validation/
          include-hidden-files: true
          if-no-files-found: warn

  windows-sandbox:
    name: Windows Sandbox VM validation
    needs: authorize
    if: ${{ inputs.method == 'all' || inputs.method == 'windows-sandbox' }}
    runs-on: [self-hosted, windows, windows-sandbox]
    environment: vm-validation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc

      - name: Windows Sandbox validation job
        shell: pwsh
        run: scripts/validate-windows-sandbox.ps1 -Vm

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsb-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: .local/wsb-validation/
          include-hidden-files: true
          if-no-files-found: warn

  wslc:
    name: WSL Containers validation
    needs: authorize
    if: ${{ inputs.method == 'all' || inputs.method == 'wslc' }}
    runs-on: [self-hosted, windows, wslc]
    environment: vm-validation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-musl

      - name: WSL Containers validation job
        shell: pwsh
        run: scripts/validate-wslc.ps1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wslc-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: .local/wslc-validation/
          include-hidden-files: true
          if-no-files-found: warn

  windows-isolation:
    name: Windows isolation mechanism validation
    needs: authorize
    if: ${{ inputs.method == 'all' || inputs.method == 'windows-isolation' }}
    runs-on: [self-hosted, windows, winiso]
    environment: vm-validation
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.0"

      - name: Windows isolation validation job
        shell: pwsh
        run: scripts/validate-windows-isolation.ps1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winiso-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: .local/winiso-validation/
          include-hidden-files: true
          if-no-files-found: warn
